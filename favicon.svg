  <ellipse cx="32" cy="38" rx="30" ry="11" fill="#000000" stroke="#00dcff" stroke-width="3.5"/>
  <!-- dome fills upper half -->
  <ellipse cx="32" cy="26" rx="16" ry="14" fill="#00ff88"/>
