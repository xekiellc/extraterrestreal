  <path d="M4 39 Q32 56 60 39" fill="none" stroke="#00dcff" stroke-width="2.5" opacity=".7"/>
  <!-- legs -->
  <line x1="20" y1="48" x2="14" y2="60" stroke="#00dcff" stroke-width="2.5"/>
  <line x1="32" y1="49" x2="32" y2="62" stroke="#00dcff" stroke-width="2.5"/>
  <line x1="44" y1="48" x2="50" y2="60" stroke="#00dcff" stroke-width="2.5"/>
</svg>
