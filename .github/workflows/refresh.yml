name: Refresh Content

on:
  schedule:
    - cron: '0 0 * * *'
    - cron: '0 4 * * *'
    - cron: '0 8 * * *'
    - cron: '0 12 * * *'
    - cron: '0 16 * * *'
    - cron: '0 20 * * *'
  workflow_dispatch:

jobs:
  refresh:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests anthropic

      - name: Run pipeline
        env:
          NEWS_API_KEY: ${{ secrets.NEWS_API_KEY }}
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python scripts/fetch.py

      - name: Commit and push
        run: |
          git config user.name "ExtraterrestrEAL Bot"
          git config user.email "bot@extraterrestreal.com"
          git add data/
          git diff --staged --quiet || git commit -m "🛸 Feed refresh $(date -u '+%Y-%m-%d %H:%M UTC')"
          git push

      - name: Post to Voxxee
        run: |
          curl -s -X POST https://xenchee.netlify.app/.netlify/functions/pipeline-post \
            -H "Content-Type: application/json" \
            -H "x-pipeline-secret: ${{ secrets.PIPELINE_SECRET }}" \
            -d '{
              "slug": "extraterrestreal",
              "title": "🛸 ExtraterrestrEAL — Latest UFO & Alien News",
              "summary": "Fresh extraterrestrial news, UAP updates, and cosmic discoveries from beyond our world.",
              "url": "https://extraterrestreal.com"
            }'
